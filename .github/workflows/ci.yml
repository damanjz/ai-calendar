name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Use `npm install`, not `npm ci`: npm ci can skip optional native bindings
      # even when they're in the lockfile (npm/cli#4828), which breaks oxlint's
      # platform binary on Linux. `npm install` resolves them correctly and, with
      # an up-to-date lockfile, does not mutate it.
      - name: Install (workspaces)
        run: npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test (server) + coverage
        run: npm run test:coverage

      - name: Build (client)
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # audit reads the lockfile; no full install needed.
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=moderate
