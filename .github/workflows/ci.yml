name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # npm/cli#4828: npm drops optional native bindings (here oxlint's Linux
      # binary) when installing from a lockfile resolved on another platform.
      # The reliable fix, per npm's own error message, is a fresh install with
      # no lockfile/node_modules to inherit the broken optional-dep state.
      - name: Install (workspaces)
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Test (server) + coverage
        run: npm run test:coverage

      - name: Build (client)
        run: npm run build

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      # audit reads the committed lockfile directly — no install needed.
      - name: npm audit (production)
        run: npm audit --omit=dev --audit-level=moderate
