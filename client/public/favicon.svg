<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <!-- AI Calendar mark: a calendar grid with one "found" free slot.
       Indigo #4f6ef7 matches the app accent. -->
  <defs>
    <linearGradient id="g" x1="6" y1="6" x2="42" y2="44" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5b78f8"/>
      <stop offset="1" stop-color="#4457e0"/>
    </linearGradient>
  </defs>

  <!-- body -->
  <rect x="5" y="9" width="38" height="34" rx="9" fill="url(#g)"/>
  <!-- header band -->
  <path d="M5 18a9 9 0 0 1 9-9h20a9 9 0 0 1 9 9v2H5z" fill="#3f51d4"/>
  <!-- binder rings -->
  <rect x="15" y="4" width="4" height="10" rx="2" fill="#c7d0f9"/>
  <rect x="29" y="4" width="4" height="10" rx="2" fill="#c7d0f9"/>

  <!-- grid of day cells -->
  <g fill="#ffffff" opacity="0.55">
    <rect x="11" y="25" width="6" height="5" rx="1.5"/>
    <rect x="21" y="25" width="6" height="5" rx="1.5"/>
    <rect x="11" y="33" width="6" height="5" rx="1.5"/>
    <rect x="31" y="33" width="6" height="5" rx="1.5"/>
  </g>

  <!-- the interrogated / found free slot -->
  <rect x="29" y="23" width="10" height="9" rx="2.5" fill="#ffffff"/>
  <path d="M31.6 27.4l1.9 1.9 3.1-3.4" stroke="#4f6ef7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
